[project]
name = "safekeep"
version = "0.0.0"
description = "Config-driven file preservation with self-describing dated snapshots"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["backup", "snapshot", "rsync", "manifest", "dotfiles", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]

# An application, so this is the application floor rather than a library's — the
# only caller is the person running it. Matches the floor the script carried as
# a PEP 723 header in dotfiles.
requires-python = ">=3.12"

# The house palette and help grammar, so safekeep's screens match every other
# CLI on PATH. Everything else is stdlib: the config is read with tomllib and
# the copying is rsync.
dependencies = ["pytermstyle"]

[tool.uv.sources]
# Pinned to a tag rather than tracking main, so a push to pytermstyle cannot
# change what a release of this builds against.
pytermstyle = { git = "https://github.com/datapointchris/pytermstyle", tag = "v0.1.1" }

[project.scripts]
safekeep = "safekeep:main"

[project.urls]
Repository = "https://github.com/datapointchris/safekeep"
Issues = "https://github.com/datapointchris/safekeep/issues"
Changelog = "https://github.com/datapointchris/safekeep/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    # Tests only. tomllib reads TOML but cannot write it, and the alternative was
    # a hand-rolled serializer in the test file; safekeep never writes a config.
    "tomli-w>=1.0.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "build(release): {version}"
build_command = """
    pip install uv
    uv lock --upgrade-package safekeep
    git add uv.lock
"""

[build-system]
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "safekeep"
module-root = "src"
