[project]
name = "safekeep"
version = "2.0.0"
description = "Config-driven file preservation with self-describing dated snapshots"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["backup", "snapshot", "rsync", "manifest", "dotfiles", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]

# An application, so this is the application floor rather than a library's — the
# only caller is the person running it. Matches the floor the script carried as
# a PEP 723 header in dotfiles.
requires-python = ">=3.12"

# The house palette and help grammar, so safekeep's screens match every other
# CLI on PATH, and the fleet's notify-only self-update. Both are themselves
# dependency-free, so the copying is still rsync and the config is still read
# with stdlib tomllib.
# pyselfupdate resolves from PyPI and pytermstyle from git, purely because
# 'pytermstyle' was already taken there. No [typer] extra — safekeep is argparse,
# and that extra exists only for the ready-made typer command.
dependencies = ["pytermstyle", "pyselfupdate>=0.2.2"]

[tool.uv.sources]
# Pinned to a tag rather than tracking main, so a push to pytermstyle cannot
# change what a release of this builds against.
pytermstyle = { git = "https://github.com/datapointchris/pytermstyle", tag = "v0.1.1" }

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603", "B607"]

[tool.codespell]
check-filenames = true

[tool.pytest.ini_options]
addopts = "-vv"
minversion = "8.0"
testpaths = ["tests"]

[tool.forge]
# Keys the standard owns, written by `forge dies run maintenance/sync-pyproject.sh`.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "addopts"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]

[project.scripts]
safekeep = "safekeep:main"

[project.urls]
Repository = "https://github.com/datapointchris/safekeep"
Issues = "https://github.com/datapointchris/safekeep/issues"
Changelog = "https://github.com/datapointchris/safekeep/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    # Tests only. tomllib reads TOML but cannot write it, and the alternative was
    # a hand-rolled serializer in the test file; safekeep never writes a config.
    "tomli-w>=1.0.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "build(release): {version}"
build_command = """
    pip install uv
    uv lock --upgrade-package safekeep
    git add uv.lock
"""

[build-system]
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "safekeep"
module-root = "src"
