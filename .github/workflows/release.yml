name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race, because
# both runs resolve the same next version from the same newest tag.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
# A newer push replaces a waiting run, so a burst of pushes releases once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Without this, release publishes whatever is on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/python-semantic-release.yml@v1
    permissions:
      contents: write

  # In the same workflow as the release, because a tag pushed with
  # GITHUB_TOKEN starts no other workflow run. The shared workflow is a job
  # apart from the release, so the index credentials reach its steps alone.
  #
  # It skips each file the index already holds, so re-running a publish that
  # failed partway uploads the rest.
  #
  # A commit that bumps nothing leaves `released` false, and this is skipped.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: datapointchris/reusable-workflows/.github/workflows/python-publish.yml@v1
    with:
      tag: ${{ needs.release.outputs.tag }}
      publish-url: https://pypi.ichrisbirch.com/
      check-url: https://pypi.ichrisbirch.com/simple/
    secrets:
      username: ${{ secrets.PYPI_ICB_USERNAME }}
      password: ${{ secrets.PYPI_ICB_PASSWORD }}
