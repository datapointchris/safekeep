name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race, and the later
# run fails pushing its version bump onto a ref that has already moved.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Without this, release publishes whatever is on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  # There is no publish job. safekeep is installed from this repo with uv, and
  # the private index is the next channel; nothing goes to public PyPI. The tag
  # is what an install resolves against.
  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/python-semantic-release.yml@v1
    permissions:
      contents: write
